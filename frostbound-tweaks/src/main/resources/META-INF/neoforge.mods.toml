modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "frostbound_tweaks"
version = "2.0.0"
displayName = "Frostbound Tweaks"
authors = "Tim"
description = '''
Anpassungen für das Modpack: Die Jahreszeiten von Serene Seasons folgen dem echten Kalender (Server).
Mitgelieferte Resource Packs werden einmal eingeschaltet und lassen sich danach abwählen (Client).
Ladereihenfolge Farmer's Delight vor Coffee Delight.
'''
# Client und Server brauchen sie nicht gegenseitig
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "frostbound_tweaks.mixins.json"

[[dependencies.frostbound_tweaks]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.frostbound_tweaks]]
modId = "sereneseasons"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Coffee Delight liest beim Registrieren Farmer's-Delight-Blöcke, deklariert die Reihenfolge aber nicht.
# Über diese Mod entsteht die Kette farmersdelight -> frostbound_tweaks -> coffee_delight.
[[dependencies.frostbound_tweaks]]
modId = "farmersdelight"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.frostbound_tweaks]]
modId = "coffee_delight"
type = "optional"
versionRange = "*"
ordering = "BEFORE"
side = "BOTH"
