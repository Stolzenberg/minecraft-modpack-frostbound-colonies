modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "frostbound_tweaks"
version = "1.2.0"
displayName = "Frostbound Tweaks"
authors = "Tim"
description = '''
Anpassungen für Frostbound Colonies: Schneefall, Schneegeräusche und Nebel von Colder Primal Winter nur bei echtem Niederschlag (Client).
Der Cold-Sweat-Hearth heizt seinen Raum selbst, der Rauchabzug oben ist Schornstein bzw. Lüftungsrohr (Server und Client).
Mitgelieferte Resource Packs werden einmal eingeschaltet und lassen sich danach abwählen (Client).
'''
# Client und Server brauchen sie nicht gegenseitig: ohne Mod im Client fehlen nur die Partikel an den Hearth-Seiten
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "frostbound_tweaks.mixins.json"

[[mixins]]
config = "frostbound_tweaks.coldsweat.mixins.json"

[[dependencies.frostbound_tweaks]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.frostbound_tweaks]]
modId = "primalwinter"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.frostbound_tweaks]]
modId = "cold_sweat"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
