plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.1.0'
group = 'de.frostbound'
base { archivesName = 'frostbound-tweaks' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.256'
    mods {
        frostbound_tweaks { sourceSet sourceSets.main }
    }
}

repositories {
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // Cold Sweat 2.4.4, wie im Pack (für das Hearth-Mixin)
    compileOnly 'maven.modrinth:uXhSmPjd:UGoodVYD'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
